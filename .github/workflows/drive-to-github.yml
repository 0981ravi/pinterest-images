name: Drive to GitHub (History images)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download each image from Google Drive
        run: |
          fail=0
          while IFS=$'\t' read -r id path; do
            [ -z "$id" ] && continue
            mkdir -p "$(dirname "$path")"
            curl -sSL --retry 3 -o "$path" "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
            if ! file "$path" | grep -qiE 'image|PNG|JPEG'; then
              echo "NOT AN IMAGE: $path ($id)"; head -c 300 "$path"; echo; rm -f "$path"; fail=1
            fi
          done < history-list.tsv
          find history -type f | sort > history/files.txt
          echo "Downloaded: $(wc -l < history/files.txt)"
          exit $fail

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add history
          git commit -m "Add Ancient Indian History images from Drive" || echo "nothing to commit"
          git push
